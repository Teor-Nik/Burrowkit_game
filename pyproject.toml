[project]
name = "Burrowkit_game"
description = "A turn-based dungeon crawler written in Python."
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pygame-ce"]

[tool.pytest.ini_options] 
testpaths = ["tests"]
pythonpath = ["src"] 

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "D", "UP"]  # errors, pyflakes, isort, warnings, naming, docstrings, pyupgrade

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
